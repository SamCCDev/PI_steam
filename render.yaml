# Blueprint de despliegue en Render.com (plan free).
# Uso: en el dashboard de Render -> New + -> Blueprint -> conectar este repo.
# El plan free duerme tras 15 min sin tráfico; el primer request lo despierta (~30-60s).
services:
  - type: web
    name: steampredict
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
